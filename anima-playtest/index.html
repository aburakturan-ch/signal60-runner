<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#080a0c"><title>ANIMA — Playtest Masası</title><style>html,body{margin:0;height:100%;background:#080a0c;color:#f5f1e8;font-family:system-ui;display:grid;place-items:center}.load{max-width:520px;padding:24px;text-align:center}.bar{height:3px;background:#222;margin-top:16px;overflow:hidden}.bar:after{content:"";display:block;width:35%;height:100%;background:#d94b42;animation:a 1s infinite alternate}@keyframes a{to{transform:translateX(185%)}}small{color:#9aa4ae}</style></head><body><div class="load"><b>ANIMA yükleniyor…</b><br><small>Türk Canavarları Sözlüğü playtest masası</small><div class="bar"></div></div><script>(async()=>{try{const ids=['00','01','02','03','04','05'];const parts=await Promise.all(ids.map(i=>fetch('data/'+i+'.txt?v=1').then(r=>{if(!r.ok)throw Error('Dosya '+i+' alınamadı');return r.text()})));const bytes=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw Error('Tarayıcınız gzip açmayı desteklemiyor');const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="load"><b>Yükleme hatası</b><p>'+String(e.message||e)+'</p><small>Chrome, Safari veya Edge’in güncel sürümünü kullanın.</small></div>'}})()</script></body></html>
