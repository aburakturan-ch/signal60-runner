name: Build Gulsen Word Tools Windows No Updater v0.3.0

on:
  push:
    branches:
      - gulsen-windows-no-updater-v031
    paths:
      - "gulsen-build/app/gulsen_word_tools_v030_no_updater.py"
      - ".github/workflows/gulsen-windows-no-updater-v030.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_VERSION: "0.3.0"

jobs:
  windows:
    name: Windows 10/11 x64 standalone no updater
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: gulsen-build/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r gulsen-build/requirements.txt pyinstaller==6.16.0
          choco install tesseract -y --no-progress
          $tess = "$env:ProgramFiles\Tesseract-OCR"
          New-Item -ItemType Directory -Force -Path "$tess\tessdata" | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/tur.traineddata" -OutFile "$tess\tessdata\tur.traineddata"
          Get-ChildItem "$tess\tessdata\*.traineddata" | Where-Object { $_.Name -notin @('tur.traineddata','eng.traineddata','osd.traineddata') } | Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Compile and feature tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "${{ github.workspace }}\gulsen-build\app"
          $env:GULSEN_TESSERACT_EXE = "$env:ProgramFiles\Tesseract-OCR\tesseract.exe"
          $env:GULSEN_TESSDATA = "$env:ProgramFiles\Tesseract-OCR\tessdata"
          python -m py_compile gulsen-build/app/gulsen_word_tools_v030_no_updater.py gulsen-build/app/ocr_engine.py gulsen-build/app/pdf_to_word.py gulsen-build/app/line_repair.py
          @'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from PIL import Image, ImageDraw, ImageFont
          from ocr_engine import ocr_image
          from pdf_to_word import convert_media_to_word
          src=Path('gulsen-build/app/gulsen_word_tools_v030_no_updater.py').read_text(encoding='utf-8')
          assert 'from updater import' not in src
          assert 'update_clicked' not in src
          assert 'Güncelle' not in src
          assert 'auto_start = tk.BooleanVar(value=True)' in src
          assert 'İşlem sürüyor' in src
          assert 'file_done' in src
          assert 'Listeyi Temizle' in src
          assert 'mode="determinate"' in src
          with TemporaryDirectory() as td:
              root=Path(td)
              img=Image.new('RGB',(1200,700),'white')
              draw=ImageDraw.Draw(img)
              font=ImageFont.truetype(r'C:\Windows\Fonts\arial.ttf',60)
              draw.text((70,170),'Beyin dalgalari ve etkileri',fill='black',font=font)
              ip=root/'scan.jpg'; img.rotate(2.0,expand=True,fillcolor='white').save(ip)
              o=ocr_image(ip)
              assert 'Beyin' in o.text or 'beyin' in o.text, o.text
              c=convert_media_to_word(ip,False)
              assert not c.skipped and c.output.exists(), c
          print('Windows no-updater + OCR feature tests passed.')
          '@ | python -

      - name: Build standalone EXE
        shell: pwsh
        run: |
          $tess = "$env:ProgramFiles\Tesseract-OCR"
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "GulsenWordTools" `
            --paths gulsen-build/app `
            --collect-all pymupdf `
            --collect-all tkinterdnd2 `
            --add-data "$tess;tesseract" `
            gulsen-build/app/gulsen_word_tools_v030_no_updater.py
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist\GulsenWordTools.exe "out\GulsenWordTools_Windows10_11_x64_NoUpdater_v0.3.0.exe"

      - name: Launch test
        shell: pwsh
        run: |
          $exe=Resolve-Path "out\GulsenWordTools_Windows10_11_x64_NoUpdater_v0.3.0.exe"
          $bytes=[System.IO.File]::ReadAllBytes($exe)
          if($bytes[0]-ne 0x4D -or $bytes[1]-ne 0x5A){ throw 'PE/MZ değil' }
          $p=Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          if($p.HasExited){ throw "Uygulama erken kapandı: $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          (Get-FileHash $exe -Algorithm SHA256).Hash | Set-Content out\SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: gulsen-windows-no-updater-v0.3.0
          path: |
            out/GulsenWordTools_Windows10_11_x64_NoUpdater_v0.3.0.exe
            out/SHA256.txt
          compression-level: 0
          if-no-files-found: error
