name: Fetch SIGNAL60 site source

on:
  push:
    branches: [agent/diagnose-no-buys]
    paths: [".github/workflows/fetch-site-source.yml", "diagnostics/fetch-site-trigger.txt", "diagnostics/fetch-market-bundle-trigger.txt"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/diagnose-no-buys
      - name: Fetch site and scripts
        run: |
          set -euo pipefail
          mkdir -p diagnostics/site
          base='https://binance-hourly-heatmap.burakturan000.chatgpt.site'
          curl -fsSL "$base/" -o diagnostics/site/index.html
          bundle=$(grep -oE '/assets/market-dashboard-[^" ]+\.js' diagnostics/site/index.html | head -1)
          test -n "$bundle"
          curl -fsSL "$base$bundle" -o diagnostics/site/market-dashboard.js
          grep -oE '.{0,180}(minimumVerified|cooldownMinutes|maxOpenPositions|maxOrderUsd|minimumNetEdge|S60-PAPER|risk gate|api/market).{0,280}' diagnostics/site/market-dashboard.js > diagnostics/site/bundle-matches.txt || true
      - name: Save fetched source
        run: |
          git config user.name signal60-diagnostic
          git config user.email signal60-diagnostic@users.noreply.github.com
          git add diagnostics/site
          git commit -m "Capture published SIGNAL60 market bundle"
          git push origin HEAD:agent/diagnose-no-buys
