name: Build and Release Gulsen Word Tools v0.2.6

on:
  push:
    branches:
      - gulsen-v026-build
    paths:
      - "gulsen-build/**"
      - ".github/workflows/gulsen-v026-release.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "0.2.6"
  RELEASE_TAG: "gulsen-v0.2.6"

jobs:
  windows:
    name: Windows 10/11 x64 standalone + OCR
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: gulsen-build/requirements.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r gulsen-build/requirements.txt pyinstaller==6.16.0

      - name: Install and trim bundled Tesseract OCR
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $tess = "$env:ProgramFiles\Tesseract-OCR"
          if (!(Test-Path "$tess\tesseract.exe")) { throw "Tesseract kurulamadı" }
          New-Item -ItemType Directory -Force -Path "$tess\tessdata" | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/tur.traineddata" -OutFile "$tess\tessdata\tur.traineddata"
          Get-ChildItem "$tess\tessdata\*.traineddata" | Where-Object { $_.Name -notin @('tur.traineddata','eng.traineddata','osd.traineddata') } | Remove-Item -Force -ErrorAction SilentlyContinue
          & "$tess\tesseract.exe" --list-langs

      - name: Compile and OCR smoke tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "${{ github.workspace }}\gulsen-build\app"
          $env:GULSEN_TESSERACT_EXE = "$env:ProgramFiles\Tesseract-OCR\tesseract.exe"
          $env:GULSEN_TESSDATA = "$env:ProgramFiles\Tesseract-OCR\tessdata"
          python -m py_compile gulsen-build/app/*.py
          @'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from PIL import Image, ImageDraw, ImageFont
          from docx import Document
          import pymupdf as fitz
          from line_repair import repair_file
          from pdf_to_word import convert_media_to_word
          from ocr_engine import ocr_image
          with TemporaryDirectory() as td:
              root=Path(td)
              d=Document(); d.add_paragraph("Bu cümle burada"); d.add_paragraph("devam ediyor."); src=root/"ornek.docx"; d.save(src)
              rr=repair_file(src); assert not rr.skipped and rr.repaired_breaks>=1
              img=Image.new('RGB',(1400,800),'white'); draw=ImageDraw.Draw(img); font=ImageFont.truetype(r'C:\Windows\Fonts\arial.ttf',70); draw.text((80,180),'Beyin dalgalari ve etkileri',fill='black',font=font); ip=root/'scan.jpg'; img.rotate(2.5,expand=True,fillcolor='white').save(ip)
              o=ocr_image(ip); assert 'Beyin' in o.text or 'beyin' in o.text
              ci=convert_media_to_word(ip,False); assert not ci.skipped and ci.output.exists() and ci.ocr_pages==1
              pdf=fitz.open(); page=pdf.new_page(); page.insert_text((72,72),'PDF metin aktarimi',fontsize=14); pp=root/'ornek.pdf'; pdf.save(pp); pdf.close()
              cp=convert_media_to_word(pp,False); assert not cp.skipped and cp.output.exists()
          print('Windows motor ve OCR testleri geçti.')
          '@ | python -

      - name: Build one-file standalone EXE
        shell: pwsh
        run: |
          $tess = "$env:ProgramFiles\Tesseract-OCR"
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "GulsenWordTools" `
            --paths gulsen-build/app `
            --collect-all pymupdf `
            --collect-all tkinterdnd2 `
            --add-data "$tess;tesseract" `
            gulsen-build/app/gulsen_word_tools.py
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist\GulsenWordTools.exe "out\GulsenWordTools_Windows10_11_x64_v0.2.6.exe"

      - name: Build compatibility folder standalone
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build,dist -ErrorAction SilentlyContinue
          $tess = "$env:ProgramFiles\Tesseract-OCR"
          pyinstaller --noconfirm --clean --windowed `
            --name "GulsenWordTools" `
            --paths gulsen-build/app `
            --collect-all pymupdf `
            --collect-all tkinterdnd2 `
            --add-data "$tess;tesseract" `
            gulsen-build/app/gulsen_word_tools.py
          Compress-Archive -Path dist\GulsenWordTools\* -DestinationPath "out\GulsenWordTools_Windows10_11_x64_CompatibilityFolder_v0.2.6.zip" -CompressionLevel Optimal -Force

      - name: Verify Windows executable launches
        shell: pwsh
        run: |
          $exe=Resolve-Path "out\GulsenWordTools_Windows10_11_x64_v0.2.6.exe"
          $bytes=[System.IO.File]::ReadAllBytes($exe); if($bytes[0]-ne 0x4D -or $bytes[1]-ne 0x5A){throw 'PE/MZ değil'}
          $p=Start-Process -FilePath $exe -PassThru; Start-Sleep -Seconds 7; if($p.HasExited){throw "Uygulama erken kapandı: $($p.ExitCode)"}; Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: gulsen-windows-v0.2.6
          path: out/*
          compression-level: 0

  macos:
    name: macOS Apple Silicon standalone + OCR
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Verify Apple Silicon and install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          brew install python@3.12 python-tk@3.12 tesseract dylibbundler
          BASE="$(brew --prefix python@3.12)/bin/python3.12"
          "$BASE" -m venv .venv
          PY="$GITHUB_WORKSPACE/.venv/bin/python"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install -r gulsen-build/requirements.txt pyinstaller==6.16.0
          echo "PY=$PY" >> "$GITHUB_ENV"

      - name: Create self-contained arm64 Tesseract bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ocr_bundle/lib ocr_bundle/tessdata
          cp "$(which tesseract)" ocr_bundle/tesseract
          chmod +x ocr_bundle/tesseract
          TESS_PREFIX="$(brew --prefix tesseract)"
          cp "$TESS_PREFIX/share/tessdata/eng.traineddata" ocr_bundle/tessdata/
          cp "$TESS_PREFIX/share/tessdata/osd.traineddata" ocr_bundle/tessdata/
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/tur.traineddata" -o ocr_bundle/tessdata/tur.traineddata
          dylibbundler -od -b -x ocr_bundle/tesseract -d ocr_bundle/lib -p @executable_path/lib/
          file ocr_bundle/tesseract
          otool -L ocr_bundle/tesseract | head -30

      - name: Compile and OCR smoke tests
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/gulsen-build/app"
          export GULSEN_TESSERACT_EXE="$GITHUB_WORKSPACE/ocr_bundle/tesseract"
          export GULSEN_TESSDATA="$GITHUB_WORKSPACE/ocr_bundle/tessdata"
          "$PY" -m py_compile gulsen-build/app/*.py
          "$PY" - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from PIL import Image, ImageDraw, ImageFont
          from docx import Document
          from line_repair import repair_file
          from pdf_to_word import convert_media_to_word
          from ocr_engine import ocr_image
          with TemporaryDirectory() as td:
              root=Path(td)
              d=Document(); d.add_paragraph('Bu cümle burada'); d.add_paragraph('devam ediyor.'); src=root/'ornek.docx'; d.save(src)
              rr=repair_file(src); assert not rr.skipped and rr.repaired_breaks>=1
              img=Image.new('RGB',(1400,800),'white'); draw=ImageDraw.Draw(img); font=ImageFont.truetype('/System/Library/Fonts/Supplemental/Arial.ttf',70); draw.text((80,180),'Beyin dalgalari ve etkileri',fill='black',font=font); ip=root/'scan.jpg'; img.rotate(2.5,expand=True,fillcolor='white').save(ip)
              o=ocr_image(ip); assert 'Beyin' in o.text or 'beyin' in o.text
              ci=convert_media_to_word(ip,False); assert not ci.skipped and ci.output.exists()
          print('Mac motor ve OCR testleri geçti.')
          PY

      - name: Build arm64 app bundle
        shell: bash
        run: |
          set -euo pipefail
          "$PY" -m PyInstaller --noconfirm --clean --windowed \
            --name "Gülşen'in Word Araçları" \
            --paths gulsen-build/app \
            --collect-all pymupdf \
            --collect-all tkinterdnd2 \
            --add-data "ocr_bundle:tesseract" \
            gulsen-build/app/gulsen_word_tools.py
          APP="dist/Gülşen'in Word Araçları.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          file "$APP/Contents/MacOS/Gülşen'in Word Araçları"
          file "$APP/Contents/Resources/tesseract/tesseract" || true

      - name: Launch smoke test and package
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/Gülşen'in Word Araçları.app"
          "$APP/Contents/MacOS/Gülşen'in Word Araçları" >/tmp/gulsen_app.log 2>&1 &
          PID=$!
          sleep 7
          if ! kill -0 "$PID" 2>/dev/null; then cat /tmp/gulsen_app.log; exit 1; fi
          kill "$PID" || true
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent "$APP" "out/GulsenWordTools_Mac_AppleSilicon_v0.2.6.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: gulsen-mac-v0.2.6
          path: out/*
          compression-level: 0

  release:
    name: Publish updater release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gulsen-*-v0.2.6
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum GulsenWordTools_Windows10_11_x64_v0.2.6.exe GulsenWordTools_Windows10_11_x64_CompatibilityFolder_v0.2.6.zip GulsenWordTools_Mac_AppleSilicon_v0.2.6.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release used by in-app updater
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gulsen-v0.2.6
          name: "Gülşen'in Word Araçları v0.2.6"
          body: |
            OCR ve otomatik güncelleme sürümü.

            - DOCX satır onarımı
            - PDF ve görselden Word aktarımı
            - taranmış PDF / JPG / PNG / TIFF / BMP / WEBP için çevrimdışı OCR
            - Türkçe + İngilizce OCR
            - yamuk taramalarda otomatik açı düzeltme
            - PDF metnini koordinatlara kilitlemeden sade Word paragraf akışına dönüştürme
            - sürükle-bırak dosya/klasör desteği
            - uygulama içinden Güncelle düğmesi
            - Windows 10/11 x64 standalone ve macOS Apple Silicon standalone

            Not: El yazısı OCR desteklenir ancak basılı metne göre doğruluk daha düşük olabilir.
          files: |
            release-assets/GulsenWordTools_Windows10_11_x64_v0.2.6.exe
            release-assets/GulsenWordTools_Windows10_11_x64_CompatibilityFolder_v0.2.6.zip
            release-assets/GulsenWordTools_Mac_AppleSilicon_v0.2.6.zip
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
          make_latest: false
