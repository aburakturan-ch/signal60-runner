name: SIGNAL60 24-7 Runner

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/signal60-runner.yml
      - runner/signal60-runner.mjs
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:

concurrency:
  group: signal60-market-cycle
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  market-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out runner
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build active paper-trading runner
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('runner/signal60-runner.mjs').read_text()

          marker = 'const KLINE_BATCH_SIZE = 4;'
          assert marker in src
          src = src.replace(marker, marker + '''
const POLICY_OVERRIDES = {
  maxOrderUsd: 5,
  maxAssetExposureUsd: 10,
  maxOpenPositions: 12,
  maxPortfolioExposurePct: 80,
  stopLossPct: -1.5,
  takeProfitPct: 2.5,
  cooldownMinutes: 5,
  minimumVerifiedSamples: 20,
  minimumVerifiedAccuracyPct: 48,
  minimumNetEdgePct: 0,
};
const TARGET_DEEP_PAIRS = 60;''', 1)

          plan_marker = '''  if (!Array.isArray(plan.pairs) || plan.pairs.length < 8) {
    throw new Error("SIGNAL/60 returned an incomplete deep-model plan");
  }
'''
          assert plan_marker in src
          src = src.replace(plan_marker, plan_marker + '''
  const plannedSymbols = new Set(plan.pairs.map((row) => row?.pair).filter(Boolean));
  const liquidFallbacks = [...tickers]
    .sort((a, b) => Number(b.quoteVolume) - Number(a.quoteVolume))
    .map((row) => row.symbol)
    .filter((symbol) => /^[A-Z0-9]+USDT$/.test(symbol));
  for (const pair of liquidFallbacks) {
    if (plan.pairs.length >= TARGET_DEEP_PAIRS) break;
    if (!plannedSymbols.has(pair)) {
      plan.pairs.push({ pair });
      plannedSymbols.add(pair);
    }
  }
''', 1)

          plan_payload = '''    tickers,
  });'''
          assert plan_payload in src
          src = src.replace(plan_payload, '''    tickers,
    policy: POLICY_OVERRIDES,
  });''', 1)

          execute_payload = '''      datasets,
    },'''
          assert execute_payload in src
          src = src.replace(execute_payload, '''      datasets,
      policy: POLICY_OVERRIDES,
    },''', 1)

          Path('/tmp/signal60-active-runner.mjs').write_text(src)
          PY
          node --check /tmp/signal60-active-runner.mjs

      - name: Run authenticated Binance cycle
        run: node /tmp/signal60-active-runner.mjs
        env:
          SIGNAL60_SITE_URL: https://binance-hourly-heatmap.burakturan000.chatgpt.site
          SIGNAL60_RUNNER_ID: github-actions-v1
