name: Deploy SIGNAL60 V2 Pages
on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: docs}
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Record successful deployment
        run: |
          printf '{"deployedAt":"%s","url":"%s","sha":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ steps.deployment.outputs.page_url }}" "$GITHUB_SHA" > .pages-deployment.json
          git config user.name signal60-v2-bot
          git config user.email signal60-v2-bot@users.noreply.github.com
          git add .pages-deployment.json
          git diff --cached --quiet && exit 0
          git commit -m "Record SIGNAL60 V2 Pages deployment"
          git push
