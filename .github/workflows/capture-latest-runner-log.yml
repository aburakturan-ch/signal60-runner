name: Capture latest SIGNAL60 runner log

on:
  push:
    branches: [agent/diagnose-no-buys]
    paths: [".github/workflows/capture-latest-runner-log.yml", "diagnostics/capture-runner-log-trigger.txt"]

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/diagnose-no-buys
      - name: Fetch latest runner run and logs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics/latest-runner
          api="https://api.github.com/repos/$REPO"
          h1="Accept: application/vnd.github+json"
          h2="Authorization: Bearer $GH_TOKEN"
          h3="X-GitHub-Api-Version: 2022-11-28"
          curl -fsSL -H "$h1" -H "$h2" -H "$h3" "$api/actions/workflows/signal60-runner.yml/runs?per_page=10" -o diagnostics/latest-runner/runs.json
          run_id=$(node -e "const x=require('./diagnostics/latest-runner/runs.json'); const r=x.workflow_runs?.[0]; if(!r)process.exit(2); console.log(r.id)")
          curl -fsSL -H "$h1" -H "$h2" -H "$h3" "$api/actions/runs/$run_id/jobs?per_page=20" -o diagnostics/latest-runner/jobs.json
          job_id=$(node -e "const x=require('./diagnostics/latest-runner/jobs.json'); const r=x.jobs?.[0]; if(!r)process.exit(2); console.log(r.id)")
          curl -fsSL -L -H "$h1" -H "$h2" -H "$h3" "$api/actions/jobs/$job_id/logs" -o diagnostics/latest-runner/job.log
          node - <<'NODE'
          const fs=require('fs');
          const runs=JSON.parse(fs.readFileSync('diagnostics/latest-runner/runs.json','utf8'));
          const jobs=JSON.parse(fs.readFileSync('diagnostics/latest-runner/jobs.json','utf8'));
          const summary={capturedAt:new Date().toISOString(),runs:(runs.workflow_runs||[]).map(r=>({id:r.id,event:r.event,status:r.status,conclusion:r.conclusion,createdAt:r.created_at,updatedAt:r.updated_at,headSha:r.head_sha,url:r.html_url})),jobs:(jobs.jobs||[]).map(j=>({id:j.id,name:j.name,status:j.status,conclusion:j.conclusion,startedAt:j.started_at,completedAt:j.completed_at,steps:j.steps}))};
          fs.writeFileSync('diagnostics/latest-runner/summary.json',JSON.stringify(summary,null,2)+'\n');
          NODE
      - name: Save capture
        if: always()
        run: |
          git config user.name signal60-diagnostic
          git config user.email signal60-diagnostic@users.noreply.github.com
          git add diagnostics/latest-runner
          git diff --cached --quiet && exit 0
          git commit -m "Capture latest SIGNAL60 runner failure"
          git push origin HEAD:agent/diagnose-no-buys
