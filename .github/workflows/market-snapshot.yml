name: SIGNAL60 V2 snapshot
on:
  push:
    branches: [main]
    paths: ["runner/**", "tests/**", ".github/workflows/market-snapshot.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signal60-v2-snapshot
  cancel-in-progress: true
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: node --test tests/engine.test.mjs
      - run: node runner/generate-snapshot.mjs
        env: {DEEP_LIMIT: "60", DEPTH_LIMIT: "20"}
      - run: |
          git config user.name signal60-v2-bot
          git config user.email signal60-v2-bot@users.noreply.github.com
          git add docs/data/latest.json
          git diff --cached --quiet && exit 0
          git commit -m "Update SIGNAL60 V2 snapshot"
          git push
